name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The extension builds its own Python env with uv when it exists; the test suite does the
      # same, so CI exercises the real creation path rather than a pre-installed interpreter.
      - run: pip install --quiet uv
      - run: npm ci
      - run: npm run check
